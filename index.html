<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Studio</title>
    <link rel="icon" type="image/jpeg" href="/src/assets/images/app_icon_1786433858169.jpg" />
    <link rel="apple-touch-icon" href="/src/assets/images/app_icon_1786433858169.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Crimson Pro"', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                300: '#d6d3d1',
                400: '#a8a29e',
                500: '#78716c',
                600: '#57534e',
                700: '#44403c',
                800: '#292524',
                900: '#1c1917',
                950: '#0c0a09',
              },
              ink: {
                900: '#1a1a1a',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #fafaf9; /* stone-50 */
        color: #1c1917; /* stone-900 */
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .dark body {
        background-color: #0c0a09; /* stone-950 */
        color: #fafaf9; /* stone-50 */
      }
      /* Custom scrollbar for sidebar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #e7e5e4;
        border-radius: 3px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background-color: #44403c;
      }
    </style>

  }
}
</script>
