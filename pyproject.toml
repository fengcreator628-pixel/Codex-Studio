[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-studio"
version = "0.1.0"
description = "Codex Studio local-first writing operating system core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
